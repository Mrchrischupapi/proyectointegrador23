# ===============================================
# CONFIGURACIÓN DE CONEXIÓN A ORACLE CLOUD
# ===============================================

# Apunta a la carpeta wallet situada en src/main/resources/wallet
spring.datasource.url=jdbc:oracle:thin:@proyectointegrador_medium?TNS_ADMIN=./src/main/resources/wallet

# Driver JDBC de Oracle
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Credenciales de acceso
spring.datasource.username=ADMIN
spring.datasource.password=Integradora1

# ===============================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===============================================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true