<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - UXVIBE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .title-header {
            color: #555555;
            font-size: 1.5rem;
            margin-bottom: 15px;
            align-self: flex-start;
            margin-left: max(20px, calc((100vw - 850px) / 2));
            font-weight: 600;
        }

        .outer-container {
            background-color: #1d4ed8;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 850px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
        }

        .card {
            display: flex;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            min-height: 520px;
        }

        /* Banner Izquierdo */
        .banner {
            background-color: #728db2;
            color: white;
            width: 45%;
            padding: 50px 30px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
        }

        .banner h1 {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 2.8rem;
            letter-spacing: 1px;
            font-weight: normal;
            color: #000;
            margin-bottom: 30px;
        }

        .banner h2 {
            font-size: 2rem;
            line-height: 1.4;
            font-weight: 700;
            color: #ffffff;
        }

        /* Formulario Derecho */
        .form-container {
            width: 55%;
            padding: 25px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-group {
            margin-bottom: 8px;
        }

        .form-group label {
            display: block;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1.1rem;
            color: #000;
            margin-bottom: 2px;
        }

        .form-group input {
            width: 100%;
            padding: 6px 12px;
            border: 1px solid #7a7a7a;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            color: #333;
        }

        .form-group input::placeholder {
            color: #b5b5b5;
        }

        .form-group input:focus {
            border-color: #0056b3;
        }

        /* Botón centrado */
        .btn-submit {
            width: 65%;
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 20px;
            font-size: 1.1rem;
            cursor: pointer;
            margin: 15px auto 5px auto;
            display: block;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #004494;
        }

        .login-link-container {
            text-align: center;
            margin-top: 10px;
            font-size: 0.85rem;
            color: #555;
        }

        .login-link-container a {
            color: #0056b3;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link-container a:hover {
            text-decoration: underline;
        }

        /* --- ESTILOS DEL MODAL DE ÉXITO --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background-color: #1b3580;
            width: 310px;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: popIn 0.3s ease-out forwards;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-icon {
            width: 65px;
            height: 65px;
            margin-bottom: 5px;
        }

        .modal-text {
            font-size: 1.05rem;
            line-height: 1.4;
            font-weight: 500;
        }

        .btn-volver {
            background-color: #60a5fa;
            color: white;
            border: none;
            padding: 8px 30px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s;
        }

        .btn-volver:hover {
            background-color: #3b82f6;
        }

        @media (max-width: 768px) {
            .card {
                flex-direction: column;
            }
            .banner, .form-container {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<h2 class="title-header">Registro</h2>

<div class="outer-container">
    <div class="card">

        <!-- Panel Izquierdo -->
        <div class="banner">
            <div>
                <h1>REGISTRO</h1>
                <h2>BIENVENIDO A<br>UXVIBE!</h2>
            </div>
        </div>

        <!-- Formulario Derecho -->
        <div class="form-container">
            <form id="registroForm">

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Christopher"
                           oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '')" required>
                </div>

                <div class="form-group">
                    <label for="apellidoPaterno">Apellido Paterno</label>
                    <input type="text" id="apellidoPaterno" name="apellidoPaterno" placeholder="Vega"
                           oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '')" required>
                </div>

                <div class="form-group">
                    <label for="apellidoMaterno">Apellido Materno</label>
                    <input type="text" id="apellidoMaterno" name="apellidoMaterno" placeholder="Aragon"
                           oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '')" required>
                </div>

                <div class="form-group">
                    <label for="correo">Correo Personal</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@utez.edu.mx" required>
                </div>

                <div class="form-group">
                    <label for="confirmarCorreo">Confirma tu correo</label>
                    <input type="email" id="confirmarCorreo" name="confirmarCorreo" placeholder="ejemplo@utez.edu.mx" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="7776000025"
                           maxlength="10"
                           oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Nomelase76@" required>
                </div>

                <div class="form-group">
                    <label for="confirmarPassword">Confirma tu contraseña</label>
                    <input type="password" id="confirmarPassword" name="confirmarPassword" placeholder="Nomelase76@" required>
                </div>

                <button type="submit" class="btn-submit">Registrar</button>

                <div class="login-link-container">
                    ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión aquí</a>
                </div>

            </form>
        </div>

    </div>
</div>

<!-- VENTANA EMERGENTE (MODAL) -->
<div id="modalExito" class="modal-overlay">
    <div class="modal-box">
        <svg class="modal-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M32 32C38.6274 32 44 26.6274 44 20C44 13.3726 38.6274 8 32 8C25.3726 8 20 13.3726 20 20C20 26.6274 25.3726 32 32 32Z" fill="#3b82f6"/>
            <path d="M16 56C16 46 23.1176 38 32 38C34.2 38 36.3 38.45 38.2 39.25C37.4 41.6 37.1 44.15 37.45 46.8C35.8 46.3 33.95 46 32 46C23.5 46 16.5 51.5 16 56H16Z" fill="#3b82f6"/>
            <circle cx="46" cy="46" r="14" fill="#2563eb"/>
            <path d="M41 46L44.5 49.5L51 43" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        <p class="modal-text">
            Registro<br>
            Exitoso, Porfavor<br>
            volver a iniciar<br>
            sesion.
        </p>

        <a th:href="@{/login}" class="btn-volver">volver</a>
    </div>
</div>

<script>
    document.getElementById('registroForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const nombre = document.getElementById('nombre').value.trim();
        const apellidoPaterno = document.getElementById('apellidoPaterno').value.trim();
        const apellidoMaterno = document.getElementById('apellidoMaterno').value.trim();
        const correo = document.getElementById('correo').value;
        const confirmarCorreo = document.getElementById('confirmarCorreo').value;
        const telefono = document.getElementById('telefono').value;
        const password = document.getElementById('password').value;
        const confirmarPassword = document.getElementById('confirmarPassword').value;

        if(nombre === "" || apellidoPaterno === "" || apellidoMaterno === "") {
            alert('Por favor, completa correctamente tu nombre y apellidos.');
            return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailRegex.test(correo)) {
            alert('Por favor, ingresa un formato de correo electrónico válido.');
            return;
        }

        if (correo !== confirmarCorreo) {
            alert('Los correos electrónicos no coinciden.');
            return;
        }

        if (telefono.length !== 10) {
            alert('El número de teléfono debe contener exactamente 10 dígitos numéricos.');
            return;
        }

        if (password.length < 8) {
            alert('Por seguridad, la contraseña debe tener al menos 8 caracteres.');
            return;
        }

        if (password !== confirmarPassword) {
            alert('Las contraseñas no coinciden.');
            return;
        }

        const formData = new URLSearchParams(new FormData(this));

        fetch('/registro', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: formData
        })
            .then(response => {
                if (response.ok) {
                    document.getElementById('modalExito').style.display = 'flex';
                } else {
                    alert('Ocurrió un error al guardar el registro en la base de datos.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error al conectar con el servidor.');
            });
    });
</script>

</body>
</html>
